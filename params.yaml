global:
  target: "popularity"
  seed: 0

preprocess:
  cols_to_drop: ["Unnamed: 0", "track_id", "artists", "album_name", "track_name"]
  missing_drop_threshold: 0.50 
  outlier_cols: ["duration_ms", "loudness", "speechiness"]
  z_threshold: 3.0

split-data:
  train_split: 0.7
  test_split: 0.3

featurize:
  categorical_max_unique: 15
  skew_threshold: 1.0
  categorical_col: "track_genre"
  one_hot_prefix: "genre"