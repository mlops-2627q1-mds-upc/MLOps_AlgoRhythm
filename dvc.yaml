stages:
  preprocess:
    cmd: python src/data/preprocess.py data/raw/dataset.csv 
      data/interim/inter_data.csv data/interim/dataset_preprocessed.csv
    deps:
    - data/raw/dataset.csv
    - data/interim/inter_data.csv
    - src/data/preprocess.py
    params:
    - preprocess.cols_to_drop
    - preprocess.missing_drop_threshold
    - preprocess.outlier_cols
    - preprocess.z_threshold
    - global.target
    outs:
    - data/interim/dataset_preprocessed.csv
  validate-preprocess:
    cmd: python src/validation/validate_preprocess.py data/interim/inter_data.csv
      data/interim/dataset_preprocessed.csv reports/preprocess_report.json
    deps:
    - data/interim/inter_data.csv
    - data/interim/dataset_preprocessed.csv
    - src/validation/validate_preprocess.py
    - src/validation/common.py
    params:
    - global.target
    - preprocess.cols_to_drop
    - preprocess.missing_drop_threshold
    - preprocess.outlier_cols
    - preprocess.z_threshold
    outs:
    - reports/preprocess_report.json:
        cache: false
  split-data:
    cmd: python src/data/split_data.py data/interim/dataset_preprocessed.csv 
      data/interim
    deps:
    - data/interim/dataset_preprocessed.csv
    - src/data/split_data.py
    - reports/preprocess_report.json
    - src/config.py
    params:
    - global.seed
    - split-data.test_split
    - split-data.train_split
    outs:
    - data/interim/test.csv
    - data/interim/train.csv
  validate-split:
    cmd: python src/validation/validate_split.py data/interim/dataset_preprocessed.csv
      data/interim reports/split_report.json
    deps:
    - data/interim/dataset_preprocessed.csv
    - data/interim/train.csv
    - data/interim/test.csv
    - src/validation/validate_split.py
    - src/validation/common.py
    params:
    - split-data.test_split
    outs:
    - reports/split_report.json:
        cache: false
  featurize:
    cmd: python src/data/featurize.py data/interim data/processed
    deps:
    - data/interim/test.csv
    - data/interim/train.csv
    - src/data/featurize.py
    - reports/split_report.json
    - src/config.py
    params:
    - featurize.categorical_col
    - featurize.categorical_max_unique
    - featurize.one_hot_prefix
    - featurize.skew_threshold
    - global.target
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  validate-featurize:
    cmd: python src/validation/validate_featurize.py data/interim data/processed
      reports/featurize_report.json
    deps:
    - data/interim/train.csv
    - data/interim/test.csv
    - data/processed/train.csv
    - data/processed/test.csv
    - src/validation/validate_featurize.py
    - src/validation/common.py
    params:
    - global.target
    - featurize.categorical_col
    - featurize.categorical_max_unique
    - featurize.one_hot_prefix
    - featurize.skew_threshold
    outs:
    - reports/featurize_report.json:
        cache: false
  train:
    cmd: python src/modeling/train.py
    deps:
    - data/processed/test.csv
    - data/processed/train.csv
    - reports/featurize_report.json
    - src/modeling/train.py
    params:
    - global.seed
    - global.target
    - split-data.test_split
    - train.n_estimators
    outs:
    - models/random_forest.pkl
