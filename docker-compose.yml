services:
  algorythm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algorythm-mlops-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algorythm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algorythm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-algorythm_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always


  algorythm-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      # Optional: overrides the default CMD to run a specific test file or output verbose results
    command: python -m pytest -v


  db:
    image: postgres:16-alpine
    container_name: algorythm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: